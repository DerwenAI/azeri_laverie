[project]
name = "azeri-laverie"
version = "1.0.0"
description = "Analysis of money laundering in the 'Azerjaibani Laundromat' leaked banking data provided by OCCRP"

authors = [
    {name = "Paco Nathan", email = "paco@derwen.ai"}
]

license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13,<3.14.1 || >3.14.1"

dependencies = [
    "requests (>=2.34.2,<3.0.0)",

    "jupyter (>=1.1.1,<2.0)",
    "jupyterlab (>=4.6.3,<5.0)",
    "watermark (>=2.6.0,<3.0)",
    "icecream (>=2.2,<3.0)",

    "networkx (>=3.6.1,<4.0)",
    "polars (>=1.44.1,<2.0)",
    "pandas (>=3.0.5,<4.0)",
    "scipy (>=1.18.1,<2.0)",

    "seaborn (>=0.13.2,<0.14.0)",
    "pyvis (>=0.3.2,<0.4.0)",
]


[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
